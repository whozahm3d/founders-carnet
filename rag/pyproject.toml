[build-system]
requires = ["setuptools==84.2.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "founders-carnet-rag"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pypdf==6.21.4",
    "pgvector==0.5.1",
    "sentence-transformers==6.1.0",
    "torch==2.15.0",
    "rank-bm25==0.2.2",
]

[tool.setuptools]
packages = ["rag", "rag.compliance"]
package-dir = { "rag" = ".", "rag.compliance" = "compliance" }
